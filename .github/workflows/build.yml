name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Instalar Flet
        run: |
          pip install "flet[all]==0.25.2"

      - name: Compilar APK
        run: |
          flet build apk --verbose

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-gestion-queso
          path: build/apk/*.apk
          if-no-files-found: warn
