name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Clonar y parchear template de Flet
        run: |
          git clone --depth 1 --branch 0.24.1 https://github.com/flet-dev/flet-build-template.git /tmp/flet-template
          echo "===== PUBSPEC ORIGINAL ====="
          cat /tmp/flet-template/pubspec.yaml
          echo "===== APLICANDO PARCHE ====="
          sed -i -E 's/wakelock_plus: *\^*[0-9]+\.[0-9]+\.[0-9]+/wakelock_plus: 1.2.4/' /tmp/flet-template/pubspec.yaml
          echo "===== PUBSPEC MODIFICADO ====="
          cat /tmp/flet-template/pubspec.yaml

      - name: Instalar Flet
        run: |
          pip install "flet[all]==0.24.1"

      - name: Compilar APK
        run: |
          flet build apk --verbose --template /tmp/flet-template

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-gestion-queso
          path: build/**/*.apk
          if-no-files-found: warn
