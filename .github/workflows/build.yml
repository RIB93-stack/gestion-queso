name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Instalar Flet
        run: |
          pip install "flet[all]==0.24.1"

      - name: Compilar APK
        run: |
          # Genera el proyecto de Flutter y aplica la corrección
          python -c "
import re, subprocess, os
# Ejecuta flet build para generar la estructura, pero capturamos el error
# para que no detenga el script.
subprocess.run(['flet', 'build', 'apk'], capture_output=True, text=True)
# Buscamos el directorio del proyecto de Flutter
import glob
path = glob.glob('/tmp/flet_flutter_build_*/pubspec.yaml')
if path:
    pubspec_path = path[0]
    with open(pubspec_path, 'r') as f:
        content = f.read()
    # Añadimos dependency_overrides si no está
    if 'dependency_overrides:' not in content:
        override = '\ndependency_overrides:\n  wakelock_plus: 1.2.10\n'
        content += override
        with open(pubspec_path, 'w') as f:
            f.write(content)
    # Volvemos a ejecutar la compilación, ahora con la corrección aplicada
    subprocess.run(['flet', 'build', 'apk', '--verbose'], check=True)
else:
    print('No se encontró el archivo pubspec.yaml para parchear.')
    exit(1)
"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-gestion-queso
          path: build/**/*.apk
          if-no-files-found: warn
